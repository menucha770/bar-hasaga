name: import-site-v23
on:
  push:
    paths: [".github/workflows/import-site-v23.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "ecd08c094ec8943dfe26bf43da80f221bb6ca9f1e1879823ba68eab3aac02ebd  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v23.yml
          git commit -m "גרסה 23: ניסוחים והידעת"
          git push
