name: import-site-v34
on:
  push:
    paths: [".github/workflows/import-site-v34.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "432f665760d2f769595c06c4ffd0e6d2c56fadb89a85626a5e65b5bd89a8f038  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v34.yml
          git commit -m "v34: תרשים חדש + 51 מושגים"
          git push
