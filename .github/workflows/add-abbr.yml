name: add-abbr
on:
  push:
    paths: [".github/workflows/add-abbr.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and sw.js
        run: python3 .github/abbr-patch.py
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html sw.js
          git rm -q .github/workflows/add-abbr.yml .github/abbr-patch.py .github/abbr-repl.json
          git commit -m "לשונית חדשה: ראשי תיבות בתורת החסידות (530 פיענוחים ודאיים)"
          git push
