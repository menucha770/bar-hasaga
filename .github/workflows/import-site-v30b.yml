name: import-site-v30b
on:
  push:
    paths: [".github/workflows/import-site-v30b.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "5ad7d17d5677dc1545baedd2c3bd5301647cbfd572041a7312f1a50b16692b90  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v30b.yml
          git commit -m "v30b: חידון tab"
          git push
