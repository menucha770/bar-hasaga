name: import-site-v33b
on:
  push:
    paths: [".github/workflows/import-site-v33b.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "4795269f4ba99a2a0de66c58c32b2a351c53d82f1e5ada4380b72c90d8f75a98  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v33b.yml
          git commit -m "v33: תיקונים אחרונים"
          git push
