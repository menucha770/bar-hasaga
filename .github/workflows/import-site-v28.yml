name: import-site-v28
on:
  push:
    paths: [".github/workflows/import-site-v28.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "081638e3f9decfc6ae6d31400c1f4250ecc728127a1f85dc5e6686693cab2695  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v28.yml
          git commit -m "הרחבות לכל המושגים + מושגים חדשים"
          git push
