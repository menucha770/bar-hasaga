name: import-site-v19b
on:
  push:
    paths: [".github/workflows/import-site-v19b.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "94b241154f8a2b05cb3c19f1ea051d65caf47934a73f0e59159617be746fe733  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v19b.yml
          git commit -m "גרסה 19 בלי תוויות"
          git push
