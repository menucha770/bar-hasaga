name: import-site-v32
on:
  push:
    paths: [".github/workflows/import-site-v32.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "259bd6fac94786e4cd73ab452104e572e75853110deebaf9fd1e00fba8370d0e  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v32.yml
          git commit -m "v32: הרחבת טקסטים, פתיחות פשוטות, תיקון מקורות"
          git push
