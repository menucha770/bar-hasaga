name: import-site-v36
on:
  push:
    paths: [".github/workflows/import-site-v36.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "38ffbfc8df9e6ee38643ef4ef94c66d7823f158c14290bb823da56c83a9a460a  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v36.yml
          git commit -m "v36: 41 מושגים לתרשים, חידון קשה יותר, תיקוני מקורות"
          git push
