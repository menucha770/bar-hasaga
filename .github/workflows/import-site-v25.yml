name: import-site-v25
on:
  push:
    paths: [".github/workflows/import-site-v25.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "ff0e45353ca903787c02ba739ae29e7e74c405d2d420f7db69a049d56ecaeac2  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v25.yml
          git commit -m "שפע, אור וחיות"
          git push
