name: abbr-v42
on:
  push:
    paths: [".github/workflows/abbr-v42.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and sw.js
        run: python3 .github/abbr-v42-patch.py
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html sw.js
          git rm -q .github/workflows/abbr-v42.yml .github/abbr-v42-patch.py .github/abbr-v42-repl.json
          git commit -m "ראשי תיבות: סבב סריקה שני, 374 חדשים ממאגר אוצר 770 (2,334 בסך הכל)"
          git push
