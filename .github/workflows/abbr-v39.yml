name: abbr-v39
on:
  push:
    paths: [".github/workflows/abbr-v39.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and sw.js
        run: python3 .github/abbr-v39-patch.py
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html sw.js
          git rm -q .github/workflows/abbr-v39.yml .github/abbr-v39-patch.py .github/abbr-v39-repl.json
          git commit -m "ראשי תיבות: פיענוחי מנוחה (33) ומאגר אוצר 770 (952), 1,952 בסך הכל; מ״ן בתרשים למתחילים"
          git push
