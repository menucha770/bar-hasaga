name: import-site-v33
on:
  push:
    paths: [".github/workflows/import-site-v33.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "aba2b19482c3b62bc95c77e3f234c8827a938569123deadf27c36e9bcc9cb729  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v33.yml
          git commit -m "v33: 42 מושגים חדשים"
          git push
