name: import-site-v24
on:
  push:
    paths: [".github/workflows/import-site-v24.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "69503c15609a39a289bcce362b7a9d0dd620be570049c8a28f3f7d0757a4764c  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v24.yml
          git commit -m "גרסה 24: זוגות, הרחבות ו-404"
          git push
