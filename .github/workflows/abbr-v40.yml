name: abbr-v40
on:
  push:
    paths: [".github/workflows/abbr-v40.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and sw.js
        run: python3 .github/abbr-v40-patch.py
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html sw.js
          git rm -q .github/workflows/abbr-v40.yml .github/abbr-v40-patch.py
          git commit -m "ראשי תיבות: הוסר כיתוב המקור ״פיענוח מנוחה גליס״ (הפירושים נשארו)"
          git push
