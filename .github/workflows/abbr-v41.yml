name: abbr-v41
on:
  push:
    paths: [".github/workflows/abbr-v41.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and sw.js
        run: python3 .github/abbr-v41-patch.py
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html sw.js
          git rm -q .github/workflows/abbr-v41.yml .github/abbr-v41-patch.py
          git commit -m "ראשי תיבות: 8 פיענוחים נוספים (תער״ב, עטר״ת, ו״ה, שז״ע, ח״ז, וז״ע, תרח״ץ, הו״ל)"
          git push
