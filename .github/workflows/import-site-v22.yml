name: import-site-v22
on:
  push:
    paths: [".github/workflows/import-site-v22.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "4ca306006942288c794719313406e85ed8ed1225e5ada28b89a7ea0b08e495dc  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v22.yml
          git commit -m "גרסה 22: מקורות מאומתים"
          git push
