name: import-site-v26
on:
  push:
    paths: [".github/workflows/import-site-v26.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "b7f2dd6a5176981025aa634eae3587a3f1bba3193ff350505e71fde77b3acfdf  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v26.yml
          git commit -m "הרחבות סבב 2"
          git push
