name: import-site-v21
on:
  push:
    paths: [".github/workflows/import-site-v21.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html and verify
        run: |
          curl -fsSL --retry 5 -o index.html "https://chabad-map.sites.tab.bot/?nc=$GITHUB_RUN_ID"
          echo "55faa046a4329443d3164e8e6ceab2712bc77b312cd9e2048f160f34226012f3  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/import-site-v21.yml
          git commit -m "האתר: גרסה 21 (תתי נושאים בתוך התיבות)"
          git push
