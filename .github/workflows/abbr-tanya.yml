name: abbr-tanya
on:
  push:
    paths: [".github/workflows/abbr-tanya.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and sw.js
        run: python3 .github/abbr-tanya-patch.py
      - name: Commit
        run: |
          git config user.name "menucha770"
          git config user.email "346415404+menucha770@users.noreply.github.com"
          git add index.html sw.js
          git rm -q .github/workflows/abbr-tanya.yml .github/abbr-tanya-patch.py .github/abbr-tanya-repl.json
          git commit -m "ראשי תיבות: לפי לוח ראשי התיבות שבתניא (570 מהלוח, 967 בסך הכל)"
          git push
