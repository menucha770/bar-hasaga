/* ==========================================================
   מפת תורת חב״ד · מערכת עיצוב "קלאסי"
   style-classic.css · גרסה 1 · 16.10.2026
   מחליף את כל כללי העיצוב בדף הראשי. שמות המחלקות והמשתנים לא השתנו.
   עיקרון: ענייני, ברור ובטוח, כמו מאגר ידע של מוסד אקדמי או ספר לימוד טוב.
   לבן נקי, טקסט כהה, כחול עמוק אחד, וצבע עזר אחד לסימון "נבדק".
   בלי מרקמים, בלי גרדיאנטים, בלי צללים, ובלי שום קישור לאינטרנט.
   ========================================================== */


/* ---------- 1. גופנים ----------
   כותרות: Frank Ruhl Libre. גוף הטקסט: Assistant.
   אם קובצי הגופנים נמצאים בתיקייה fonts ליד הדף, הם נטענים משם.
   אם לא, הדפדפן משתמש בגופן המותקן במחשב באותו שם,
   ואחר כך בגופני המערכת: FrankRuehl או David לכותרות, Segoe UI או Arial לגוף. */




/* ---------- 2. משתנים: תאורה בהירה (ברירת מחדל) ---------- */
:root{
  /* הפלטה */
  --white:#FFFFFF;       /* כרטיסים */
  --page:#F8F9FB;        /* רקע הדף: כמעט לבן */
  --panel:#F2F5F9;       /* משטח משני: ראש טבלה, תיבת הסבר */
  --charcoal:#1C2430;    /* טקסט */
  --navy:#1F4A80;        /* הצבע הראשי: קישורים, לשונית פעילה, כותרות משנה */
  --navy-tint:#E8EEF6;   /* רקע בהיר מאוד של הכחול, לתגיות */
  --teal:#2B6E6A;        /* צבע העזר: "נבדק" ותגיות */
  --teal-tint:#E4F0EE;

  /* שמות ישנים, נשמרים כדי שהקוד הקיים ימשיך לעבוד */
  --sand:var(--page); --cream:var(--white); --plaster:var(--panel); --beige:#D9DEE5;
  --midnight:var(--navy); --olive:var(--teal); --terra:var(--navy); --ochre:var(--navy);

  /* תפקידים. השמות האלה משמשים גם בתוך הקוד של הדף, אסור לשנות אותם */
  --bg:var(--page);
  --card:var(--white);
  --ink:var(--charcoal);
  --muted:#4E5866;
  --faint:#646E7B;
  --line:#D9DEE5;
  --line-soft:#E8EBF0;
  --accent:var(--navy);
  --accent2:var(--navy);
  --hi:#FFF0B3;
  --on-accent:#FFFFFF;
  --head-ink:#16202E;
  --th-bg:var(--panel);
  --th-ink:#16202E;
  --zebra:#FAFBFC;
  --ok:var(--teal);   --ok-bg:var(--teal-tint);
  --todo:#5E6670;     --todo-bg:#F1F2F4;

  /* גופנים */
  --font-head:"Mapa Serif","Frank Ruhl Libre","FrankRuehl","Frank Ruehl CLM","David Libre","David","Noto Serif Hebrew","Times New Roman",serif;
  --font-body:"Mapa Sans","Assistant","Heebo","Segoe UI","Arial Hebrew","Arial","Noto Sans Hebrew",sans-serif;

  /* גודלי טקסט */
  --fs-xs:12px; --fs-sm:14px; --fs-base:17px; --fs-lg:18px;
  --fs-h3:21px; --fs-h2:26px; --fs-h1:38px;

  /* מרווחים */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;

  /* רדיוסים: קטנים */
  --r-xs:3px; --r-sm:4px; --r-md:4px; --r-lg:4px;

  /* צללים: אין */
  --sh-1:none; --sh-2:none; --sh-3:none;

  --measure:70ch;        /* אורך שורה נוח לקריאה */
  color-scheme:light;
}


/* ---------- 3. מצב כהה: כחול-פחם, טקסט בהיר ----------
   נדלק לבד לפי הגדרות המחשב או הטלפון.
   אפשר גם לכפות: class="dark" או class="light" על התגית html. */
@media (prefers-color-scheme: dark){
  :root:not(.light){
    --white:#1B2330; --page:#141A22; --panel:#212B3A; --charcoal:#E4E8EE;
    --navy:#8FB0E0; --navy-tint:#24324A; --teal:#72C1B7; --teal-tint:#1E3533;
    --beige:#313C4C;
    --muted:#AAB3BF; --faint:#919BA8;
    --line:#313C4C; --line-soft:#283241;
    --hi:#4A4220; --on-accent:#141A22;
    --head-ink:#F1F3F6; --th-ink:#F1F3F6; --zebra:#1E2734;
    --todo:#AAB3BF; --todo-bg:#252F3D;
    color-scheme:dark;
  }
}
:root.dark{
  --white:#1B2330; --page:#141A22; --panel:#212B3A; --charcoal:#E4E8EE;
  --navy:#8FB0E0; --navy-tint:#24324A; --teal:#72C1B7; --teal-tint:#1E3533;
  --beige:#313C4C;
  --muted:#AAB3BF; --faint:#919BA8;
  --line:#313C4C; --line-soft:#283241;
  --hi:#4A4220; --on-accent:#141A22;
  --head-ink:#F1F3F6; --th-ink:#F1F3F6; --zebra:#1E2734;
  --todo:#AAB3BF; --todo-bg:#252F3D;
  color-scheme:dark;
}


/* ---------- 4. בסיס ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  border-top:4px solid var(--accent);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:var(--fs-base);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--hi);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--head-ink);line-height:1.3;font-weight:700}
h2{font-size:var(--fs-h2);margin:var(--s6) 0 var(--s3)}
h3{font-size:var(--fs-h3)}
p{max-width:var(--measure)}

/* כיתוב קטגוריה קטן מעל כותרת */
.kicker{display:block;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--accent)}

/* קישוט ישן מהעיצוב הקודם: מוסתר */
.birds{display:none !important}


/* ---------- 5. כותרת הדף, ניווט וחיפוש ---------- */
header{max-width:1200px;margin:auto;padding:36px 24px 0}
h1{margin:0 0 6px;font-size:var(--fs-h1)}
.sub{color:var(--muted);font-size:var(--fs-lg);line-height:1.6;margin:0 0 24px;max-width:65ch}

.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs{display:flex;flex-wrap:wrap;gap:0;flex:1 1 auto}
.tab{
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;
  padding:10px 14px 9px;cursor:pointer;
  font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--muted);
}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}

#q,input[type="search"]{
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 12px;font-family:inherit;font-size:16px;
}
#q{flex:0 1 340px;min-width:220px;margin-bottom:8px}
#q:focus,input[type="search"]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#q::placeholder,input[type="search"]::placeholder{color:var(--faint)}

.switches{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.switches .lbl,.lbl{font-size:14px !important;color:var(--muted) !important}

/* מתג חדשים / ותיקים: כפתורים מחוברים, הפעיל בכחול */
.mode{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.mode button{
  border:0;background:transparent;color:var(--ink);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;padding:5px 14px;
}
.mode button+button{border-inline-start:1px solid var(--line)}
.mode button:hover{background:var(--panel)}
.mode button.on,.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
body.mode-new .deep-only{display:none !important}
body.mode-deep .new-only{display:none !important}

main{max-width:1200px;margin:auto;padding:16px 24px 72px}


/* ---------- 6. כרטיס ותגיות כלליות ---------- */
.card{
  position:relative;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);padding:20px 24px;
}
.hint{color:var(--muted);font-size:15px;margin:6px 0 20px;max-width:var(--measure)}
.meta{color:var(--faint);font-family:var(--font-body);font-size:14px;font-weight:400}

.chip{
  display:inline-block;font-size:13px;line-height:1.7;padding:0 9px;margin:3px 0 3px 6px;
  color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xs);
}
/* הדף צובע תגיות בצבע של כל דמות. כאן מנטרלים, כדי שיישאר צבע ראשי אחד */
.chip[style]{border-color:var(--line) !important}

.badge{
  display:inline-block;font-family:var(--font-body);font-size:12px;font-weight:700;line-height:1.7;
  padding:0 8px;margin-inline-end:8px;vertical-align:middle;border-radius:var(--r-xs);border:1px solid transparent;
}
.b-rebbe{background:var(--navy-tint);color:var(--navy)}
.b-chassid{background:var(--teal-tint);color:var(--teal)}
.b-family{background:var(--panel);color:var(--muted);border-color:var(--line)}

.legend{
  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 16px;
  font-size:14px;color:var(--muted);
}
.legend .badge{margin-inline-end:4px}

.src{font-size:13px;color:var(--faint);margin-top:6px;line-height:1.55}
mark{background:var(--hi);color:inherit;padding:0 2px}


/* ---------- 7. מסלול הדורות ---------- */
.chain{display:flex;flex-direction:column;align-items:stretch;max-width:780px;margin:auto}
.gen{cursor:pointer;border-inline-start:4px solid var(--accent)}
.gen:hover{border-color:#B8C2CF;border-inline-start-color:var(--accent)}
.gen.t-rebbe{border-inline-start-color:var(--navy)}
.gen.t-chassid{border-inline-start-color:var(--teal)}
.gen.t-family{border-inline-start-color:#9AA4B1}
/* פלוס ומינוס בפינה: סימן שהכרטיס נפתח */
.gen::after{
  content:"+";position:absolute;top:18px;inset-inline-end:18px;width:24px;height:24px;
  display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted);
  border:1px solid var(--line);border-radius:var(--r-xs);background:var(--card);
}
.gen.open::after{content:"\2212";color:var(--accent);border-color:var(--accent)}
.gen h3{margin:0 0 2px;font-size:var(--fs-h3);padding-inline-end:36px}
.gen>p{margin:8px 0 12px}
.gen .det{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.gen.open .det{display:block}
.det .row{margin:14px 0;max-width:var(--measure)}
.det .row b{color:var(--accent)}

/* החץ בין כרטיסים: קו אפור וראש חץ קטן. הסימן ▼ שבתוך הדף מוצג בכחול */
.arrow{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  color:var(--accent);font-size:12px;line-height:1;padding:0 0 8px;
}
.arrow::before{content:"";width:1px;height:18px;background:var(--line);margin-bottom:2px}
.arrow small{display:block;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.3}

.links{font-size:14px;color:var(--muted);margin-top:8px}
.oth{border-inline-start:2px solid var(--line);padding:4px 12px;margin:6px 0}
.oth[style]{border-right-color:var(--line) !important;border-left-color:var(--line) !important}
.oth b{color:var(--ink)}
.lk{
  cursor:pointer;color:var(--accent);margin:0 4px;font-size:13px;font-weight:600;
  text-decoration:underline;text-underline-offset:2px;
}

.main-idea{
  margin:10px 0;padding:10px 14px;background:var(--panel);
  border-inline-start:3px solid var(--accent);border-radius:0 var(--r-xs) var(--r-xs) 0;
}
.main-idea b{color:var(--accent)}


/* ---------- 8. תרשים הזרימה ---------- */
.stage{margin:0 auto;max-width:1000px}
.stagetitle{
  display:table;margin:10px auto 10px;padding:2px 12px;
  font-size:14px;font-weight:700;color:var(--accent);text-align:center;
  border-bottom:2px solid var(--accent);
}
.nodes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.node{
  cursor:pointer;min-width:160px;max-width:240px;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;font-size:15px;line-height:1.45;
}
.node b{display:block;font-family:var(--font-head);font-size:19px;color:var(--head-ink)}
.node small{display:block;color:var(--faint);font-size:13px;margin-top:3px}
.node:hover{border-color:var(--accent)}
.node.on{border-color:var(--accent);background:var(--navy-tint);box-shadow:inset 0 0 0 1px var(--accent)}

#detail{
  margin:18px auto;max-width:1000px;position:sticky;bottom:10px;max-height:55vh;overflow:auto;
  border-top:3px solid var(--accent);
}
#detail>b:first-child{font-family:var(--font-head);color:var(--head-ink)}
#detail h3{margin:0 0 4px}
#detail .lvl{display:inline-flex;margin:8px 0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
#detail .lvl button{
  border:0;background:var(--card);color:var(--ink);padding:5px 16px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;
}
#detail .lvl button+button{border-inline-start:1px solid var(--line)}
#detail .lvl button.on{background:var(--accent);color:var(--on-accent)}


/* ---------- 9. פתיחה וסגירה (details) ---------- */
summary{cursor:pointer;list-style:none;position:relative;padding-inline-start:22px}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
/* חץ קטן: מצביע שמאלה כשסגור, למטה כשפתוח */
summary::before{
  content:"";position:absolute;inset-inline-start:4px;top:.6em;width:7px;height:7px;
  border:solid var(--accent);border-width:0 0 2px 2px;transform:rotate(45deg);
}
details[open]>summary::before{transform:rotate(-45deg);top:.48em}
summary:hover{color:var(--accent)}
.more details{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;margin:6px 0;background:var(--card)}
.more summary{font-weight:700;color:var(--ink)}
.more details div{padding:6px 0 2px;font-size:15px;max-width:var(--measure)}


/* ---------- 10. טבלה: נושא מול דמות ---------- */
.mwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);max-height:75vh;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:14px;line-height:1.6}
th,td{
  border-bottom:1px solid var(--line-soft);border-inline-start:1px solid var(--line-soft);
  padding:10px 12px;vertical-align:top;min-width:180px;max-width:220px;text-align:right;
}
tbody tr:nth-child(even) td{background:var(--zebra)}
thead th{
  position:sticky;top:0;z-index:2;background:var(--th-bg);color:var(--th-ink);
  font-family:var(--font-head);font-size:16px;font-weight:700;border-bottom:2px solid var(--accent);
}
thead th small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
tbody th{
  position:sticky;right:0;z-index:1;background:var(--card);min-width:140px;max-width:160px;
  text-align:right;color:var(--accent);cursor:pointer;
  font-family:var(--font-head);font-size:15px;font-weight:700;border-inline-end:1px solid var(--line);
}
tbody th:hover{background:var(--navy-tint)}
thead th:first-child{right:0;z-index:3;font-family:var(--font-body);font-size:14px}
td.empty{color:var(--faint);text-align:center}
thead th.h-rebbe{border-bottom-color:var(--navy)}
thead th.h-chassid{border-bottom-color:var(--teal)}
thead th.h-family{border-bottom-color:#9AA4B1}


/* ---------- 11. מסע של רעיון והשוואה ---------- */
select{
  padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;
}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tl{max-width:780px;margin:16px auto}
.tl .item{
  padding:10px 16px;margin:0 0 10px;background:var(--card);
  border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:var(--r-sm);
}
.tl .item b{color:var(--head-ink);font-family:var(--font-head);font-size:17px}
.cmp{display:grid;grid-template-columns:140px 1fr 1fr;gap:6px;max-width:1000px;margin:14px auto;font-size:15px}
.cmp>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.cmp .h{background:var(--panel);color:var(--head-ink);font-family:var(--font-head);font-weight:700;font-size:16px;text-align:center;border-bottom:2px solid var(--accent)}
.cmp .t{color:var(--accent);font-weight:700}
.jgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;max-width:1100px;margin:auto}
.jgrid h2{font-size:22px;margin:0 0 4px}
.jgrid .card{margin-bottom:10px}


/* ---------- 12. כלים: מילון ומסלול לימוד ---------- */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;max-width:1000px;margin:auto}
dl{margin:0}
dt{font-weight:700;color:var(--accent);margin-top:12px;font-family:var(--font-head);font-size:17px}
dd{margin:2px 0 0;max-width:var(--measure)}
ol.path{padding-inline-start:22px}
ol.path li{margin:8px 0}
li::marker{color:var(--accent);font-weight:700}
#results{display:none;max-width:1100px;margin:0 auto 16px}
#results .r{padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
#results .r:last-child{border-bottom:0}


/* ---------- 13. כפתור כללי ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:14px;font-weight:600;
  padding:5px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink);cursor:pointer;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}


/* ---------- 14. עץ פתיחה מרובה רמות ----------
   מבנה: .tree > details > summary ואחריו details פנימיים, עד כמה רמות שצריך.
   טקסט בסוף ענף: div עם המחלקה leaf. */
.tree{max-width:860px;margin:0 auto 4px}
.tree>details{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  margin:0;padding:4px 18px;
}
.tree>details[open]{padding-bottom:12px}
.tree>details>summary{font-family:var(--font-head);font-size:21px;font-weight:700;color:var(--head-ink);padding-block:10px}
.tree details details{margin:2px 0 4px;margin-inline-start:6px;padding-inline-start:14px;border-inline-start:2px solid var(--line-soft)}
.tree details details>summary{font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--accent);padding-block:6px}
.tree details details details>summary{font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--ink);padding-block:4px}
.tree details details details[open]>summary{color:var(--accent)}
.tree summary small{font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--faint);margin-inline-start:8px}
.tree .count{
  display:inline-block;font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xs);padding:0 7px;margin-inline-start:8px;
  vertical-align:middle;
}
.tree .leaf{padding:2px 0 10px;font-size:16px;max-width:var(--measure)}
.tree .leaf p{margin:6px 0}
.tree-tools{display:flex;gap:8px;justify-content:flex-end;max-width:860px;margin:0 auto 8px}


/* ---------- 15. כרטיס "שאלה גדולה" ----------
   מבנה: .bigq > .q, ואחריו .ans אחד לכל רב, ובסוף .foot. */
.bigq{max-width:860px;margin:20px auto;padding:0;overflow:hidden}
.bigq .q{padding:20px 24px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bigq .q h3{font-size:26px;margin:4px 0 6px}
.bigq .q p{margin:0;color:var(--muted);max-width:65ch}
.bigq .ans{padding:14px 24px;border-top:1px solid var(--line-soft);border-inline-start:3px solid var(--accent)}
.bigq .q+.ans{border-top:0}
.bigq .ans>div:not(.who):not(.src){max-width:var(--measure)}
.bigq .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:4px}
.bigq .who b{font-family:var(--font-head);font-size:19px;color:var(--head-ink)}
.bigq .who .badge{margin-inline-end:0}
.bigq .foot{padding:10px 24px;background:var(--panel);font-size:14px;color:var(--muted);border-top:1px solid var(--line)}


/* ---------- 16. כניסה לחדשים מול פירוט לוותיקים ---------- */
.entry{
  display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:16px 24px;align-items:start;
  max-width:1000px;margin:0 auto 20px;padding:20px 24px;
  background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r-md);
}
.entry .lead{font-family:var(--font-head);font-size:23px;font-weight:700;color:var(--head-ink);line-height:1.3}
.entry .lead small{display:block;font-family:var(--font-body);font-size:15px;font-weight:400;color:var(--muted);margin-top:6px}
.entry .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.entry .steps li{
  position:relative;counter-increment:s;background:var(--panel);border-radius:var(--r-sm);
  padding:10px 12px;padding-inline-start:44px;font-size:15px;line-height:1.55;
}
.entry .steps li::before{
  content:counter(s,hebrew);position:absolute;inset-inline-start:10px;top:10px;width:24px;height:24px;
  display:grid;place-items:center;border-radius:var(--r-xs);background:var(--accent);color:var(--on-accent);
  font-family:var(--font-body);font-weight:700;font-size:14px;line-height:1;
}
.deep-panel{
  max-width:1000px;margin:0 auto 20px;padding:12px 18px;
  background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--accent);
  border-radius:var(--r-md);font-size:15px;
}
.deep-panel b{font-family:var(--font-head);font-size:18px;color:var(--head-ink)}


/* ---------- 17. תגי מקור ----------
   span עם vtag ok: "✓ נבדק".  span עם vtag todo: "טרם אומת".
   ואפשר גם על שורת המקור עצמה: src ok או src todo. */
.vtag{
  display:inline-block;font-size:12px;font-weight:700;line-height:1.6;white-space:nowrap;
  padding:0 7px;margin-inline-end:6px;border-radius:var(--r-xs);vertical-align:middle;
}
.vtag.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.vtag.todo{background:var(--todo-bg);color:var(--todo);border:1px dashed var(--todo)}
.src.ok,.src.todo{color:var(--faint)}
.src.todo::before{content:none}
.src.ok:not(:has(.vtag)){color:var(--ok)}
.src.todo:not(:has(.vtag)){color:var(--todo)}


/* ---------- 18. סתירה לכאורה ומושג מול מושג ---------- */
.res{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;max-width:var(--measure)}
.res b{color:var(--teal)}
.openq{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:14px;color:var(--todo)}
.pair-h{display:block;font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--head-ink);margin:0 0 6px}
.pair-h span{color:var(--muted);font-family:var(--font-body);font-size:15px;font-weight:400;margin:0 4px}
.pair-h span.kind,.kind{
  display:inline-block;font-family:var(--font-body);font-size:12px;font-weight:700;
  padding:0 8px;margin-inline-start:6px;vertical-align:middle;line-height:1.7;
  border-radius:var(--r-xs);background:var(--teal-tint);color:var(--teal);
}
.card>b:first-child{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--head-ink)}


/* ==========================================================
   נייד, הדפסה ותנועה
   ========================================================== */
@media (max-width:820px){
  .jgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  :root{--fs-base:16px;--fs-lg:17px;--fs-h1:30px;--fs-h2:22px;--fs-h3:19px}
  header{padding:24px 14px 0}
  main{padding:12px 14px 60px}
  .card{padding:16px}
  .bar{gap:8px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:thin}
  .tab{white-space:nowrap;font-size:15px;padding:9px 12px 8px}
  #q{flex-basis:100%;min-width:0;width:100%}
  th,td{min-width:150px}
  tbody th{min-width:110px}
  .cmp{grid-template-columns:88px 1fr 1fr;font-size:13px}
  .entry{grid-template-columns:1fr;padding:16px}
  .tree>details{padding:4px 12px}
  .bigq .q{padding:16px}
  .bigq .q h3{font-size:22px}
  .bigq .ans,.bigq .foot{padding-inline:16px}
  #detail{max-height:60vh;bottom:0}
  .two{grid-template-columns:1fr}
}

@media print{
  @page{margin:15mm}
  html:root:not(.keep-screen-colors){
    --white:#fff; --page:#fff; --panel:#f2f2f2; --charcoal:#111;
    --navy:#1F4A80; --navy-tint:#fff; --teal:#2B6E6A; --teal-tint:#fff;
    --bg:#fff; --card:#fff; --ink:#111; --muted:#444; --faint:#555;
    --line:#bbb; --line-soft:#ddd; --head-ink:#111; --th-bg:#fff; --th-ink:#111;
    --zebra:transparent; --hi:#f3e7b0; --todo:#444; --todo-bg:#fff;
  }
  body{background:#fff;border-top:0;font-size:11pt;line-height:1.5}
  .tabs,#q,.hint,.mode,.switches,.tree-tools,.btn,.gen::after{display:none !important}
  .bar{border:0}
  .gen .det{display:block}
  #detail{position:static;max-height:none;overflow:visible}
  .mwrap{max-height:none;overflow:visible}
  thead th,tbody th{position:static}
  .card,.node,.tl .item,.bigq .ans,tr,.entry .steps li,.oth{break-inside:avoid}
  h1,h2,h3,.pair-h{break-after:avoid}
  .badge,.vtag,thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a,.lk{color:inherit;text-decoration:none}
}
/* בהדפסה כל מה שמקופל נפתח (בדפדפנים שתומכים בזה) */
@media print{
  details::details-content{content-visibility:visible;display:block}
}

.lv{display:inline-block;font-family:var(--font-body);font-size:11px;font-weight:700;border-radius:3px;padding:0 7px;margin-inline-start:6px;vertical-align:middle;line-height:1.7;white-space:nowrap}
.lv.basic{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.lv.adv{background:var(--navy-tint);color:var(--accent);border:1px solid var(--line)}
h1 a{color:inherit;text-decoration:none}
body.is-home header{padding-top:64px;text-align:center}
body.is-home h1{font-size:56px;line-height:1.15}
body.is-home .sub{margin-inline:auto;font-size:20px;max-width:55ch}
body.is-home .tabs{display:none}
body.is-home .bar{justify-content:center}
body.is-home #q{max-width:520px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:24px 0}
.home-card{display:block;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:4px;padding:18px 20px;cursor:pointer;transition:border-color .15s,background .15s}
.home-card:hover,.home-card:focus{border-color:var(--accent);background:var(--panel);outline:none}
.home-card h3{margin:0}
.hc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.home-card p{color:var(--muted);margin:8px 0 12px}
.hc-go{color:var(--accent);font-weight:700;font-size:14px}
body:not(.show-tags) .lv,body:not(.show-tags) .vtag,body:not(.show-tags) .tagonly{display:none !important}
.tagtoggle{font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;align-self:center}
.src{font-size:13px;color:var(--muted)}
.start-here{display:block;margin:24px 0 0;background:var(--teal-tint);border-color:var(--teal);border-top-color:var(--teal)}
.start-here h3{color:var(--teal)}
details.links>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
details.links{margin-top:6px}
.lk{cursor:pointer;color:var(--accent);text-decoration:underline;font-size:14px}
.fc{position:relative;max-width:1100px;margin:16px auto;padding:8px 0}
.fc-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.fc-row{position:relative;margin:36px 0}
.fc-st{text-align:center;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--faint);margin-bottom:8px}
.fc-nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 28px;position:relative;z-index:1}
.fcnode{font-family:inherit;cursor:pointer;min-width:150px;max-width:230px;background:var(--card);color:var(--ink);border:1.5px solid var(--accent);border-radius:4px;padding:10px 14px;text-align:center}
.fcnode b{display:block;font-family:var(--font-head);font-size:16px;color:var(--head-ink)}
.fcnode small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fcnode:hover,.fcnode.on{background:var(--navy-tint)}
.fc-edge{fill:none;stroke:var(--faint);stroke-width:1.4}
.fc-head{fill:var(--faint)}
.fc-lbl{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--page);stroke-width:4px;stroke-linejoin:round}
.artgrid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.artlist{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
.artitem{text-align:right;font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.artitem b{display:block}
.artitem small{color:var(--muted);display:block}
.artitem.on{border-color:var(--accent);background:var(--navy-tint)}
@media (max-width:820px){.artgrid{grid-template-columns:1fr}.artlist{position:static}body.is-home h1{font-size:38px}}
.main-idea{margin:8px 0;padding:8px 12px;background:var(--panel);border-radius:3px;border-inline-start:3px solid var(--accent)}
.jgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;max-width:1100px;margin:auto}
.jgrid h2{font-size:22px;margin:0 0 4px}
.jgrid .card{margin-bottom:10px}
@media (max-width:820px){.jgrid{grid-template-columns:1fr}}
#results{display:none;max-width:1100px;margin:0 auto 12px}
#results .r{padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}

/* ==========================================================
   גרסה 4 · 18.10.2026 · הרגעת העין
   אזורים בתרשים, שלוש רמות של תיבות, חיצים שקטים שמתחזקים רק בריחוף,
   ראש דף מצומצם, ורדיוסים ורווחים רכים יותר. v3 לא שונה.
   ========================================================== */
:root{--r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px;
  --zone:#F3F6FA; --zone-line:#E3E8EF;}
@media (prefers-color-scheme: dark){:root:not(.light){--zone:#1A2230;--zone-line:#2A3546}}
:root.dark{--zone:#1A2230;--zone-line:#2A3546}

header{padding:28px 24px 0}
h1{font-size:32px}
.sub{font-size:16px;margin-bottom:16px}
.bar{gap:6px 16px;border-bottom:0;margin-bottom:8px}
.tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-size:15px;padding:9px 12px 8px}
#q{flex:0 1 320px;min-width:200px;margin:8px 0;padding:7px 12px;font-size:15px;border-color:var(--line-soft)}
.tagtoggle{font-size:13px;color:var(--faint);margin-inline-start:auto}
main{padding-top:8px}
.hint{font-size:15px;margin:4px 0 16px}

.card,.home-card{border-radius:var(--r-md);border-color:var(--line-soft)}
.home-card{padding:20px 22px;border-top-width:2px}
.home-grid{gap:14px}
.home-card p{font-size:15px}
.chip{border-color:var(--line-soft);background:var(--panel)}

.fc{max-width:1000px;margin:8px auto}
.fc-row{margin:34px 0;padding:34px 18px 20px;background:var(--zone);border:1px solid var(--zone-line);border-radius:var(--r-lg)}
.fc-st{position:absolute;top:10px;inset-inline-start:16px;margin:0;font-size:13px;letter-spacing:0;color:var(--navy);font-weight:700}
.fc-nodes{gap:14px 20px}
.fcnode{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);min-width:150px;transition:border-color .15s,background .15s}
.fcnode b{font-size:16px}
.fcnode small{font-size:12.5px;color:var(--muted)}
.fcnode:hover,.fcnode:focus-visible{border-color:var(--accent);background:var(--card)}
.fcnode.on{background:var(--navy-tint);border-color:var(--accent)}
.fcnode.t1{background:var(--navy);border-color:var(--navy);min-width:190px;padding:14px 18px}
.fcnode.t1 b{color:var(--on-accent);font-size:18px}
.fcnode.t1 small{color:var(--on-accent);opacity:.85}
.fcnode.t1.on,.fcnode.t1:hover{background:var(--navy)}
.fcnode.t3{min-width:130px;padding:8px 12px;border-style:dashed;background:transparent}
.fcnode.t3 b{font-size:14.5px;font-weight:600}
.fcnode.t3 small{font-size:12px}
.fcnode.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fcnode.dim{opacity:.5}
.fcn{display:flex;flex-direction:column;align-items:stretch;position:relative;z-index:1;min-width:150px;max-width:230px}
.fcn.open{max-width:340px;min-width:240px}
.fcn .fcnode{min-width:0;max-width:none;width:100%}
.fc-nodes{align-items:flex-start}
.fcdet{background:var(--card);border:1px solid var(--accent);border-top:0;border-radius:0 0 var(--r-sm) var(--r-sm);padding:8px 10px;font-size:14px;line-height:1.55;text-align:right}
details.row>summary{cursor:pointer;font-weight:700;color:var(--head-ink);padding:2px 0}details.row>summary:hover{color:var(--accent)}details.row[open]>summary{margin-bottom:4px}
.fcdet p{margin:4px 0}
.fcdet details{margin:3px 0}
.fcdet summary{cursor:pointer;color:var(--accent);font-weight:600}
.fc-edge{stroke:var(--faint);stroke-width:1;opacity:.28;stroke-linejoin:round}
.fc-head{fill:var(--faint);opacity:.4}
.fc-edge.hot{stroke:var(--accent);stroke-width:1.8;opacity:1}
.fc-lbl{display:none;font-size:12px;font-weight:600;fill:var(--accent);stroke:var(--zone);stroke-width:5px}
.fc-lbl.hot{display:block}
.fc-key{margin:0 auto 6px;max-width:1000px;font-size:13px;color:var(--faint)}
.fc-key b{color:var(--navy)}

/* ---- שאר הלשוניות ---- */
.legend{font-size:13px;color:var(--faint);margin-bottom:10px}
.src{font-size:12.5px;color:var(--faint);margin-top:4px}

/* מסלול הדורות: כרטיס סגור מראה כותרת, משפט ורעיון עיקרי. ענן הנושאים נפתח רק בלחיצה */
.chain{max-width:760px}
.gen{padding:22px 26px}
.gen:not(.open)>div>.chip{display:none}
.gen.open>div:has(>.chip)::before{content:"נושאים שהרבי מדגיש";display:block;font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 4px}
.gen .main-idea{margin:14px 0 4px;background:var(--panel);border-inline-start-width:3px}
.gen .main-idea .src{display:none}
.gen.open .main-idea .src{display:block}
.arrow{padding-bottom:12px}
.arrow small{font-size:12.5px}
.jgrid .card.gen{padding:18px 22px}

/* הטבלה: עמודת נושא ושורת כותרת נשארות במקום, תאים ארוכים נקטעים */
.mwrap{border-color:var(--line-soft)}
table{border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;z-index:2}
tbody th{position:sticky;inset-inline-start:0;z-index:1;background:var(--card);box-shadow:-1px 0 0 var(--line-soft)}
td.clamp{position:relative;cursor:pointer}
td.clamp .cc{max-height:170px;overflow:hidden}
td.clamp.open .cc{max-height:none}
td.clamp:not(.open)::after{content:"עוד ↓";position:absolute;inset-inline:0;bottom:0;padding:22px 0 4px;text-align:center;font-size:12px;font-weight:700;color:var(--navy);background:linear-gradient(transparent,var(--card) 70%)}

/* מאמרים, מסע, סתירות, מושגים, שאלות: אוויר ורכות */
.artitem{border-color:var(--line-soft);border-radius:var(--r-sm);padding:12px 14px}
.artitem.on{border-inline-start:3px solid var(--accent)}
.two{gap:14px}
.bigq .q{padding:22px 26px 18px}
.bigq .ans{padding:16px 26px}
.tl .item{border-color:var(--line-soft)}
select{font-family:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--card);color:var(--ink)}

.artfilters{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
.artfilters .fl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fh{font-weight:700;color:var(--muted);font-size:13px;margin-inline-end:4px}
.fchip{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:2px 11px;cursor:pointer}
.fchip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.artgroup{margin-bottom:10px}
.artgh{font-size:13px;font-weight:700;color:var(--muted);margin:8px 2px 4px}
.arttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tg{font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--muted);background:var(--panel)}
#sfbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
/* תוספות לגרסה 4: טלפון, תתי-לשוניות, הסבר מושגים ליד המילה */
.modebtn{font-family:inherit;font-size:13px;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:14px;padding:3px 12px;cursor:pointer;align-self:center;white-space:nowrap}
.modebtn:hover{background:var(--navy-tint)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.subtabs button{font-family:inherit;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:4px 14px;cursor:pointer}
.subtabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.gl{border-bottom:1px dotted var(--accent);cursor:help;position:relative}
.gl .gdef{display:none;position:absolute;z-index:60;inset-inline-start:0;top:100%;width:260px;max-width:80vw;background:var(--card);color:var(--ink);border:1px solid var(--accent);border-radius:var(--r-sm);padding:8px 10px;font-size:13.5px;line-height:1.5;font-weight:400;text-align:right;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.gl:hover .gdef,.gl.on .gdef,.gl:focus .gdef{display:block}
.mstage{margin:10px 0;border:1px solid var(--zone-line);background:var(--zone);border-radius:var(--r-md);padding:6px 12px}
.mstage>summary{cursor:pointer;font-weight:700;color:var(--navy);padding:8px 0;font-size:16px}
.mnode{margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.mnode>summary{cursor:pointer;font-weight:700;font-size:16px}
.mnode>summary small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.mnode .mnext{margin-top:8px;font-size:13px;color:var(--faint)}
body.phone header{padding:16px 14px 0}
body.phone h1{font-size:26px}
body.phone .sub{font-size:14px}
body.phone main{padding-inline:12px}
body.phone .jgrid,body.phone .artgrid{grid-template-columns:1fr}
body.phone .artlist{position:static}
body.phone table{font-size:14px}
.mstage>summary{padding-inline-start:26px !important}
.mnode>summary{padding-inline-start:26px !important}


/* ---------- לוגו ״בר השגה״ בכותרת (גרסה 9) ---------- */
header h1.brand{margin:0 0 10px;line-height:1;font-size:0}
h1.brand a{display:inline-flex;flex-direction:column;align-items:center;gap:.5em;color:inherit;text-decoration:none;font-size:16px;border-radius:4px}
h1.brand a:focus-visible{outline:2px solid var(--teal);outline-offset:6px}
.brand-wm{display:block;height:44px;width:auto;overflow:visible}
.brand-wm path{fill:var(--navy)}
.brand-wm .wm-dot{fill:var(--teal)}
.brand-tag{display:block;font-family:"Assistant",var(--font-body,sans-serif);font-weight:600;font-size:13px;letter-spacing:.05em;color:var(--muted);line-height:1.2;white-space:nowrap}
body.is-home header h1.brand{margin-bottom:22px}
body.is-home h1.brand a{gap:.7em}
body.is-home .brand-wm{height:78px}
body.is-home .brand-tag{font-size:19px}
@media (max-width:820px){body.is-home .brand-wm{height:60px}body.is-home .brand-tag{font-size:16px}}
@media (max-width:640px){.brand-wm{height:34px}.brand-tag{font-size:12px}}
body.phone .brand-wm{height:32px}
body.phone .brand-tag{font-size:12px}
body.phone.is-home .brand-wm{height:56px}
body.phone.is-home .brand-tag{font-size:15px}
body.phone.is-home header h1.brand{margin-bottom:16px}
body.phone.is-home header{padding-top:30px}
@media print{.brand-wm{height:36px}.brand-tag{font-size:11px}}

/* ===== התרשים הראשי, גרסה 10 ===== */
:root{--edge:#9AA6B5}
@media (prefers-color-scheme: dark){:root:not(.light){--edge:#5B687A}}
:root.dark{--edge:#5B687A}
.cv-top{max-width:1100px;margin:6px auto 4px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.cv-seg{display:inline-flex;border:1px solid var(--navy);border-radius:6px;overflow:hidden;background:var(--card)}
.cv-seg button{font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--navy);background:transparent;border:0;padding:8px 22px;cursor:pointer;min-height:40px}
.cv-seg button+button{border-inline-start:1px solid var(--navy)}
.cv-seg button span{font-weight:400;font-size:13px;opacity:.75;margin-inline-start:4px}
.cv-seg button.on{background:var(--navy);color:var(--on-accent)}
.cv-seg button:focus-visible{outline:2px solid var(--teal);outline-offset:-3px}
.cv-note{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6;max-width:720px}
.cv{width:min(1240px,calc(100vw - 40px));margin:14px 0 0;position:relative;right:50%;transform:translateX(50%)}
.cv-chart{position:relative}
.cv-svg{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:1}
.cv-band{position:absolute;left:0;right:0;background:var(--zone);border:1px solid var(--zone-line);border-radius:8px}
.cv-bh{position:absolute;top:18px;right:16px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-family:var(--font-head);text-align:right}
.cv-bh .cv-no{color:var(--teal);font-weight:700;font-size:14px;font-family:var(--font-body)}
.cv-bh .cv-tt{font-weight:700;font-size:16.5px;line-height:1.3;color:var(--head-ink)}
.cv .cvn{all:unset;box-sizing:border-box;position:absolute;z-index:2;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px 9px 12px;display:flex;flex-direction:column;justify-content:center;text-align:right;transition:opacity .15s,border-color .15s,background .15s}
.cv .cvn b{font-family:var(--font-head);font-weight:700;font-size:15.5px;line-height:1.25;color:var(--head-ink)}
.cv .cvn small{font-size:12.5px;line-height:1.35;color:var(--faint);margin-top:3px}
.cv .cvn:hover,.cv .cvn:focus-visible{border-color:var(--navy)}
.cv .cvn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.cv .cvn.on{border:2px solid var(--navy);background:var(--navy-tint);padding:8px 11px}
.cv .cvn.rel{border-color:var(--navy)}
.cv-step{position:absolute;top:-9px;right:10px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--card);border:1px solid var(--teal);color:var(--teal);font:700 11.5px/16px var(--font-body);text-align:center}
.cv .cvn.on .cv-step{top:-10px;right:9px}
.cv-chart.dim .cvn:not(.on):not(.rel){opacity:.45}
.cv-e{fill:none;stroke:var(--edge);stroke-width:1.2;stroke-linejoin:round;transition:opacity .15s}
.cv-e.seq{stroke:var(--navy);stroke-width:1.4;opacity:.75}
.cv-head{fill:none;stroke:var(--edge);stroke-width:1.5}
.cv-e.seq{marker-end:url(#cvahn)}
.cv-headn{fill:none;stroke:var(--navy);stroke-width:1.6}
.cv-chart.dim .cv-e{opacity:.18}
.cv-hot .cv-e{stroke:var(--navy);stroke-width:2;opacity:1!important}
.cv-off{max-width:1100px;margin:34px auto 10px;border-top:1px solid var(--line);padding-top:6px}
.cv-off h2{margin-bottom:4px}
.cv-off h3{font-size:16px;margin:16px 0 6px;color:var(--head-ink)}
.cv-ct{font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--faint)}
.cv-offst{font-size:13px;color:var(--teal);font-weight:700;margin:10px 0 6px}
.cv-offrow{display:flex;flex-wrap:wrap;gap:8px}
.cv-off .cvx{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 12px;max-width:260px;text-align:right}
.cv-off .cvx b{display:block;font-family:var(--font-head);font-size:15px;color:var(--head-ink)}
.cv-off .cvx small{display:block;font-size:12px;color:var(--faint);margin-top:1px}
.cv-off .cvx:hover,.cv-off .cvx:focus-visible,.cv-off .cvx.on{border-color:var(--navy)}
.cv-off .cvx.on{background:var(--navy-tint)}
.cv-drawer{position:fixed;top:0;bottom:0;left:0;width:min(440px,92vw);z-index:60;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:22px 24px 40px;box-sizing:border-box;text-align:right;font-size:15px;line-height:1.65}
.cv-drawer[hidden]{display:none}
.cv-x{position:absolute;top:10px;left:12px;font-size:24px;line-height:1;background:none;border:0;color:var(--faint);cursor:pointer;padding:4px 8px}
.cv-x:hover{color:var(--navy)}
.cv-in .cv-where{font-size:12.5px;color:var(--teal);font-weight:700;margin:0 0 6px}
.cv-in h3{font-family:var(--font-head);font-size:23px;margin:0;color:var(--head-ink);line-height:1.25}
.cv-in .cv-sub{color:var(--muted);font-size:14px;margin:3px 0 8px}
.cv-in p{margin:10px 0}
.cv-in details{margin:4px 0}
.cv-in summary{cursor:pointer;color:var(--accent);font-weight:600}
.cv-in h4{font-family:var(--font-body);font-size:12.5px;font-weight:700;color:var(--navy);margin:18px 0 4px;letter-spacing:.02em}
.cv-list{list-style:none;margin:0;padding:0}
.cv-list li{border-top:1px solid var(--line-soft)}
.cv-list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:baseline;gap:8px;width:100%;padding:7px 0;font-size:14.5px;color:var(--ink)}
.cv-list button .nm{font-weight:600}
.cv-list button .lb{margin-inline-start:auto;color:var(--faint);font-size:12.5px;text-align:left}
.cv-list button:hover .nm,.cv-list button:focus-visible .nm{color:var(--navy);text-decoration:underline}
.cv-tag{font-size:11px;color:var(--teal);border:1px solid var(--teal);border-radius:3px;padding:0 5px;line-height:16px}
/* טלפון */
.cvp>summary .cv-no{color:var(--teal);font-weight:700;margin-inline-end:4px}
.cvp .mnode>summary{position:relative}
.cvp .cv-step{position:static;display:inline-block;margin-inline-end:7px;vertical-align:2px}
.cvp .cv-pn{display:block;font-weight:400;margin-top:4px;font-size:13px}
.cvp .cv-pn b{color:var(--navy);font-weight:600}
@media (max-width:760px){.cv-seg button{padding:8px 16px}.cv-note{font-size:14px}}
.cv-band{border-right:3px solid var(--zone-line)}
.cv-drawer.right{left:auto;right:0;border-right:0;border-left:1px solid var(--line)}
.cv-drawer.right .cv-x{left:auto;right:12px}
.cv-drawer.right .cv-in{padding-top:18px}
#view{overflow-x:clip}

.jr-hero p.jr-how{font-size:15px;color:var(--muted);max-width:34em;margin:0 auto}
.jr-hero-fade{opacity:var(--jp-o,1)}
.jr-cue{margin-top:28px;display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;font-family:inherit}
.jr-cue i{display:block;width:1.5px;height:34px;background:var(--line);position:relative}
.jr-cue i::after{content:"";position:absolute;bottom:-1px;left:50%;width:7px;height:7px;border-left:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateX(-50%) rotate(-45deg)}
.jr-body{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start;max-width:1120px;margin:0 auto}
/* מד העומק */
.jr-gauge{position:sticky;top:16px;font-size:13px;padding:14px 12px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.jr-g-h{font-family:var(--font-head);font-size:17px;color:var(--head-ink);margin:0 4px 10px}
.jr-u{display:grid;grid-template-columns:1fr 1fr;position:relative;padding-bottom:12px}
.jr-u ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;position:relative;min-height:300px}
.jr-u .jr-gd{padding-left:14px}
.jr-u .jr-ga{padding-right:14px}
.jr-u .jr-gd::before,.jr-u .jr-ga::before{content:"";position:absolute;top:30px;bottom:-12px;width:2px;background:var(--jd)}
.jr-u .jr-gd::before{left:5px}
.jr-u .jr-ga::before{right:5px;background:var(--ja)}
.jr-u::after{content:"";position:absolute;bottom:0;left:calc(50% - 21px);width:42px;height:2px;background:var(--jd);opacity:.9}
.jr-u .jr-gt{font-size:12px;color:var(--muted);height:28px;display:flex;align-items:center;gap:4px}
.jr-u .jr-gd .jr-gt{justify-content:flex-start}
.jr-u .jr-ga .jr-gt{justify-content:flex-end}
.jr-g-i{all:unset;box-sizing:border-box;display:block;position:relative;cursor:pointer;padding:3px 2px;line-height:1.3;color:var(--muted);border-radius:4px;width:100%}
.jr-gd .jr-g-i{text-align:right}
.jr-ga .jr-g-i{text-align:left}
.jr-g-i b{display:block;font-weight:600;font-size:11px;color:var(--faint)}
.jr-g-i::after{content:"";position:absolute;top:8px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--jd);box-sizing:border-box}
.jr-gd .jr-g-i::after{left:-14px}
.jr-ga .jr-g-i::after{right:-14px;border-color:var(--ja)}
.jr-g-i.past{color:var(--ink)}
.jr-gd .jr-g-i.past::after{background:var(--jd)}
.jr-ga .jr-g-i.past::after{background:var(--ja)}
.jr-g-i.now{color:var(--head-ink);font-weight:700}
.jr-g-i.now b{color:var(--navy)}
.jr-ga .jr-g-i.now b{color:var(--teal)}
.jr-g-i.now::after{width:14px;height:14px;top:6px;background:var(--card);border-width:4px}
.jr-gd .jr-g-i.now::after{left:-16px}
.jr-ga .jr-g-i.now::after{right:-16px}
.jr-g-i:hover{color:var(--head-ink)}
.jr-g-i:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.jr-g-deep{all:unset;cursor:pointer;display:block;text-align:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:12.5px;width:100%}
.jr-g-deep.now{color:var(--head-ink);font-weight:700}
.jr-g-deep:focus-visible{outline:2px solid var(--navy)}
.jr-gbar{display:none}
/* המסלול */
.jr-track{position:relative;padding-right:40px;min-width:0}
.jr-legend{font-size:13px;color:var(--muted);margin:0 0 18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.jr-core{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);vertical-align:middle;margin-inline-start:6px;flex:none}
.jr-sec{position:relative;margin:6px 0 4px;padding:6px 0 16px}
.jr-sec::before,.jr-st::before{content:"";position:absolute;right:-29px;top:0;bottom:0;width:2px;background:var(--jd);opacity:.35}
.jr-sec.asc::before,.jr-st.asc::before{background:var(--ja)}
.jr-sec h3{font-family:var(--font-head);font-weight:500;font-size:15px;letter-spacing:.04em;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px}
.jr-sec h3 .ar{font-family:var(--font-body);font-size:15px;color:var(--jd)}
.jr-sec.asc h3 .ar{color:var(--ja)}
.jr-sec p{margin:2px 0 0;font-size:14px;color:var(--faint)}
.jr-sec.first::before{top:-14px}
.jr-st{position:relative;padding:0 0 26px}
.jr-st-h{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;position:relative;padding:8px 0 4px;border-radius:6px}
.jr-st-h:focus-visible{outline:2px solid var(--navy);outline-offset:4px}
.jr-pt{position:absolute;right:-36px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--page);border:2px solid var(--jd);box-sizing:border-box;transition:transform .3s ease,background-color .3s ease}
.asc .jr-pt{border-color:var(--ja)}
.jr-st.open .jr-pt{background:var(--jd);transform:scale(1.15)}
.jr-st.asc.open .jr-pt{background:var(--ja)}
.jr-st.now .jr-pt{box-shadow:0 0 0 4px var(--page),0 0 0 5px var(--line)}
.jr-no{display:block;font-size:12.5px;color:var(--faint);letter-spacing:.03em;margin-bottom:2px}
.jr-nmrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.jr-nm{font-family:var(--font-head);font-size:26px;font-weight:500;color:var(--head-ink);line-height:1.2}
.jr-ct{font-size:13.5px;color:var(--muted)}
.jr-tg{margin-inline-start:auto;font-size:13px;color:var(--navy);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.asc .jr-tg{color:var(--teal)}
.jr-tg .pm{display:inline-block;width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;position:relative;box-sizing:border-box}
.jr-tg .pm::before,.jr-tg .pm::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}
.jr-tg .pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .25s ease}
.jr-st.open .jr-tg .pm::after{transform:translate(-50%,-50%) rotate(0deg)}
.jr-names{display:block;margin-top:6px;font-size:14.5px;color:var(--muted);line-height:1.6}
.jr-st.open .jr-names{display:none}
.jr-grid{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s ease}
.jr-st.open .jr-grid{grid-template-rows:1fr}
.jr-grid-in{overflow:hidden;min-height:0}
.jr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;padding:12px 2px 4px}
.jr-c{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px 13px;background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:76px;opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease,border-color .15s ease}
.jr-st.open .jr-c{opacity:1;transform:none;transition-delay:calc(var(--i,0)*35ms),calc(var(--i,0)*35ms),0s}
.jr-c:hover{border-color:var(--navy)}
.asc .jr-c:hover{border-color:var(--teal)}
.jr-c:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.jr-c .jr-cn{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;min-height:14px}
.jr-c b{font-family:var(--font-head);font-size:19px;font-weight:600;color:var(--head-ink);line-height:1.25}
.jr-c small{font-size:13.5px;color:var(--muted);line-height:1.45}
.jr-st.deep .jr-pt{border-radius:3px}
.jr-st.deep::before{display:none}
.jr-end{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:28px 0 60px;border-top:1px solid var(--line-soft);margin-top:10px}
.jr-btn{font-family:inherit;font-size:15px;padding:9px 18px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.jr-btn:hover{border-color:var(--navy);color:var(--navy)}
.jr-btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.jr-btn.pri:hover{color:#fff;opacity:.92}
.jr-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
/* מרחק: כל המסע במבט אחד */
.jr.far .jr-names,.jr.far .jr-sec p,.jr.far .jr-legend{display:none}
.jr.far .jr-st{padding-bottom:6px}
.jr.far .jr-nm{font-size:20px}
.jr.far .jr-st-h{padding:4px 0 2px}
.jr.far .jr-pt{top:9px;width:12px;height:12px;right:-34px}
.jr.far .jr-no{display:inline;margin-inline-end:8px}
.jr.far .jr-nmrow{display:inline-flex}
/* בקרי זום */
/* חלון מושג (זום פנימה) */
.jr-pw{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px}
body:not(.phone) .jr-pw{justify-content:flex-end;padding:4vh 24px} /* v14: החלונית תמיד בצד שמאל, כמו בתרשים */
.jr-pw[hidden]{display:none}
.jr-scrim{position:absolute;inset:0;background:rgba(20,26,34,.42);opacity:0;transition:opacity .26s ease}
.jr-pw.in .jr-scrim{opacity:1}
.jr-panel{position:relative;width:min(780px,100%);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 30px 30px;transform-origin:0 0;outline:none;overscroll-behavior:contain}
.jr-ptop{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:1px solid var(--line-soft);margin-bottom:16px}
.jr-out{font-family:inherit;font-size:14px;display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.jr-out:hover{border-color:var(--navy);color:var(--navy)}
.jr-out:focus-visible,.jr-nav button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.jr-out .zi{display:inline-block;width:15px;height:15px;border:1.5px solid currentColor;border-radius:50%;position:relative;box-sizing:border-box}
.jr-out .zi::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:1.5px;background:currentColor;transform:translate(-50%,-50%)}
.jr-crumb{font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-nav{display:flex;gap:4px}
.jr-nav button{font-family:inherit;font-size:13px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.jr-nav button:hover{color:var(--navy);border-color:var(--navy)}
.jr-nav button[disabled]{opacity:.4;cursor:default}
.jr-panel h2{font-family:var(--font-head);font-size:34px;font-weight:500;color:var(--head-ink);margin:0;line-height:1.15}
.jr-panel .jr-psub{color:var(--muted);font-size:16px;margin:4px 0 0}
/* סולם עומק */
.jr-lad{margin:22px 0 18px}
.jr-lad-h{font-size:12.5px;color:var(--faint);letter-spacing:.05em;margin-bottom:8px}
.jr-steps{display:flex;align-items:flex-end;gap:6px}
.jr-step{font-family:inherit;flex:1;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:14.5px;padding:8px 6px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel);color:var(--muted);cursor:pointer;border-radius:6px 6px 2px 2px;transition:background-color .2s ease,color .2s ease,border-color .2s ease;line-height:1.25}
.jr-step[data-l="1"]{min-height:42px}
.jr-step[data-l="2"]{min-height:56px}
.jr-step[data-l="3"]{min-height:70px}
.jr-step:hover{color:var(--head-ink);border-color:var(--navy)}
.jr-step.below{color:var(--ink);border-bottom-color:var(--navy)}
.jr-step.on{background:var(--navy);border-color:var(--navy);color:#fff}
.jr-step:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.jr-step .sep{display:none}
.jr-lv{min-height:60px}
.jr-lv.swap{animation:jrfade .28s ease}
@keyframes jrfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.jr-one{font-family:var(--font-head);font-size:25px;line-height:1.55;color:var(--head-ink);margin:6px 0 4px;max-width:34em}
.jr-lv p{line-height:1.75}
.jr-q{border-right:2px solid var(--teal);padding:2px 14px 2px 0;margin:14px 0}
.jr-q h5{margin:0 0 3px;font-size:14px;color:var(--teal);font-weight:600}
.jr-q div{line-height:1.75}
.jr-qnote{font-size:13px;color:var(--faint);margin:0 0 6px}
.jr-rel{margin-top:26px;border-top:1px solid var(--line-soft);padding-top:6px}
.jr-rel h4{font-size:13px;color:var(--faint);font-weight:600;letter-spacing:.04em;margin:14px 0 6px}
.jr-chips{display:flex;flex-wrap:wrap;gap:8px}
.jr-go{font-family:inherit;font-size:14.5px;display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:right}
.jr-go small{font-size:12px;color:var(--faint)}
.jr-go:hover{border-color:var(--navy);color:var(--navy)}
.jr-go:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.jr-go.sf{border-color:var(--teal);color:var(--teal)}
.jr-sfv{margin-top:6px}
.jr-sfv h3{font-family:var(--font-head);font-size:24px;font-weight:500;margin:0 0 4px;color:var(--head-ink)}
.jr-sfv .hint{margin-top:0}
/* טלפון */
body.phone .jr-hero{min-height:62vh;padding-top:8px}
body.phone .jr-hero h2{font-size:31px}
body.phone .jr-hero p.jr-lead{font-size:16.5px}
body.phone .jr-body{display:block}
body.phone .jr-gauge{display:none}
body.phone .jr-gbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;margin:0 -12px 14px;padding:9px 14px;background:var(--page);border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
body.phone .jr-gbar .dir{font-size:12.5px;color:var(--navy);white-space:nowrap}
body.phone .jr-gbar.asc .dir{color:var(--teal)}
body.phone .jr-gbar b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.phone .jr-gbar .tk{display:flex;align-items:flex-start;gap:2px;height:16px}
body.phone .jr-gbar .tk i{display:block;width:4px;border-radius:1px;background:var(--line)}
body.phone .jr-gbar .tk i.d{background:color-mix(in srgb,var(--navy) 35%,var(--line))}
body.phone .jr-gbar .tk i.a{background:color-mix(in srgb,var(--teal) 35%,var(--line))}
body.phone .jr-gbar .tk i.now{background:var(--navy)}
body.phone .jr-gbar .tk i.a.now{background:var(--teal)}
body.phone .jr-track{padding-right:30px}
body.phone .jr-sec::before,body.phone .jr-st::before{right:-21px}
body.phone .jr-pt{right:-28px}
body.phone .jr.far .jr-pt{right:-26px}
body.phone .jr-nm{font-size:23px}
body.phone .jr-tg .tx{display:none}
body.phone .jr-cards{grid-template-columns:1fr;gap:8px}
body.phone .jr-c{min-height:0;padding:11px 13px}
body.phone .jr-c b{font-size:18px}
body.phone .jr-pw{padding:0}
body.phone .jr-panel{width:100%;max-height:none;height:100%;border-radius:0;border:0;padding:0 16px 40px}
body.phone .jr-ptop{padding:12px 0 10px;margin-bottom:12px}
body.phone .jr-nav button{padding:5px 9px}
body.phone .jr-panel h2{font-size:29px}
body.phone .jr-one{font-size:21px}
body.phone .jr-step{font-size:13.5px;padding:7px 4px}

/* --- שפת העיצוב שנבחרה: 6 ״תבליט עדין״ (אריחים מורמים, נקודה צבעונית, מספר אפור בפינה, קווי צפחה רכים) --- */
.jr-c{position:relative;align-items:center;text-align:center;justify-content:center;background:var(--t-bg);border:1px solid var(--t-bd);border-radius:14px;box-shadow:var(--t-sh);padding:20px 14px 14px;min-height:88px;transition:opacity .3s ease,transform .3s ease,box-shadow .2s ease,border-color .2s ease}
.jr-c:hover,.asc .jr-c:hover{border-color:var(--t-bd);box-shadow:var(--t-sh2)}
.jr-c .jr-cn{position:absolute;top:8px;right:11px;font:700 11px var(--font-body);color:var(--t-num);min-height:0}
.jr-c .jr-cr{position:absolute;top:7px;left:10px;font:600 10.5px var(--font-body);color:var(--t-num);letter-spacing:.02em}
.jr-c b{font-family:var(--font-body);font-weight:700;font-size:17.5px;color:var(--ink);display:inline-flex;align-items:center;gap:7px;line-height:1.25}
.jr-c b::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.jr-st.ev .jr-c b::before{background:var(--navy)}
.jr-c small{font-size:12.5px;color:var(--t-sub);line-height:1.35;padding:0 6px}
.jr-no{display:inline-block;font:800 12.5px var(--font-body);color:var(--teal);background:var(--t-bg);border-radius:8px;padding:2px 9px;box-shadow:var(--t-sh);margin-bottom:6px;letter-spacing:0}
.jr-st.ev .jr-no{color:var(--navy)}
.jr-sec::before,.jr-st::before{background:var(--slate);opacity:.45}
.jr-sec.asc::before,.jr-st.asc::before{background:var(--slate)}
.jr-pt{background:var(--t-bg);border:1px solid var(--t-bd);box-shadow:var(--t-sh);width:18px;height:18px;right:-37px;top:12px}
.jr-pt::after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:var(--teal);transition:transform .3s ease}
.jr-st.ev .jr-pt::after{background:var(--navy)}
.asc .jr-pt{border-color:var(--t-bd)}
.jr-st.open .jr-pt,.jr-st.asc.open .jr-pt{background:var(--t-bg);transform:none}
.jr-st.open .jr-pt::after{transform:scale(1.6)}
.jr-st.now .jr-pt{box-shadow:var(--t-sh),0 0 0 4px var(--page),0 0 0 5px var(--slate)}
.jr-tg,.asc .jr-tg{color:var(--slate)}
.jr-cue i{background:var(--slate);opacity:.7}
.jr-cue i::after{border-color:var(--slate);border-width:0 0 1.8px 1.8px;border-style:solid;border-radius:1px}
.jr-sec h3 .ar,.jr-sec.asc h3 .ar{color:var(--slate)}
.jr-gauge{background:var(--t-bg);border:1px solid var(--t-bd);border-radius:14px;box-shadow:var(--t-sh)}
.jr-u .jr-gd::before,.jr-u .jr-ga::before,.jr-u::after{background:var(--slate);opacity:.55}
.jr-g-i::after{background:var(--t-bg);border:2px solid var(--slate)}
.jr-ga .jr-g-i::after{border-color:var(--slate)}
.jr-gd .jr-g-i.past::after,.jr-ga .jr-g-i.past::after{background:var(--slate)}
.jr-gd .jr-g-i.now::after{border-color:var(--navy);background:var(--t-bg)}
.jr-ga .jr-g-i.now::after{border-color:var(--teal);background:var(--t-bg)}
.jr-btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-accent);box-shadow:none}
.jr-btn.pri:hover{color:var(--on-accent)}
.jr-go.sf{border-color:var(--teal)}
.jr-panel{background:var(--t-bg);border-color:var(--t-bd);border-radius:14px;box-shadow:0 2px 6px rgba(20,26,34,.12),0 24px 48px -16px rgba(20,26,34,.32)}
.jr-ptop{background:var(--t-bg)}
.jr-step{border-radius:10px 10px 4px 4px;background:var(--panel)}
.jr-step.on{color:var(--on-accent)}

   מה יש בבלוק, לפי הסדר:

  summary:"מה החידוש של החסידות, אם כבר היו תורה, קבלה ומוסר? הרבי פותח בכך שנאמרו הסברים רבים (סעיף א), ואומר שכולם נכונים, אבל הם פרטים. העיקר הוא \"נקודה אחת שאינה מורכבת מפרטים שונים\" (ודאי, סעיף ב). כדי להבין אותה, הוא מסתכל על המשיח: עניינו של המשיח הוא בחינת היחידה, ו\"בחי' יחידה היא עצם הנשמה שלמעלה מגדר פרטים\" (ודאי, סעיף ה). והחסידות היא היחידה שבתורה, ולכן היא כמו שמן: \"שמן הוא נקודת התמצית (\"עסענץ\") של כל דבר\" (ודאי, סעיף ז). היא לא חלק חמישי שעומד ליד פשט, רמז, דרש וסוד, אלא מה שמכניס בכולם חיות (סעיף ח). הדוגמה היא \"מודה אני\" (סעיפים ט עד טו), שמוסבר לפי פשט, רמז, דרש וסוד, ולפי החסידות: אומרים אותו מיד בקימה, עוד לפני נטילת ידיים, כי הוא בא מהיחידה, שלא נפגמת. אבל היחידה לא מבטלת את הפרטים אלא מתבטאת דווקא בהם, ולכן חסידות צריך ללמוד ולקיים בפועל (סעיפים יז-יח). היא הופכת רע לטוב (סעיף יט) ונוגעת גם בהלכה, כמו \"ד' אמות של הלכה\" (סעיף כ). ומכאן ההכנה לביאת המשיח: \"הפצת המעינות חוצה דוקא\" (ודאי, סעיף כא).",

  question:"מה הקשר בין הגלות לגאולה, ומה ״הדרך הישרה״ שבה כל יהודי יכול לפעול את ביאת המשיח?",
  summary:"השיחה פותחת בכך ש״כלו כל הקיצין״, ולכן צריך להדגיש מה כל יהודי פועל להבאת המשיח. והדרך מתחילה בפרשה. ״תזריע״ רומז ללידה, לגאולה, ו״מצורע״ ״הוא שמו של משיח בזמן הגלות״, כמו שאמרו ״חיוורא דבי רבי שמו״ (סנהדרין צח, ב). ומכאן השאלות: איך מתחברות שתי הפרשות, ולמה שמו של משיח קשור דווקא לגלות. לנגעים יש שני הסברים: הם ״פסולת״ שעוד לא התבררה, ו״הם אורות עליונים״, ולכן נגע יכול לבוא גם על אדם שהוא ״במדרגה גדולה״ (ובהערה 34: ״נגע״ אותיות ״ענג״). ושני ההסברים מתחברים: מפני שמקור הנגעים גבוה, הרע נוגע רק בחיצוניות, והטהרה באה מ״גילוי ענינם האמיתי של הנגעים״. כך גם הגלות: מקורה נעלה, ולכן התיקון הוא ״הפיכת הגלות לגאולה״, ו״בפרשת תזריע (גאולה) מדובר בענין הנגעים (גלות)״. משם השיחה עוברת למשנה באבות, ״איזו היא דרך ישרה״, ״כל שהיא תפארת לעושי׳ ותפארת לו מן האדם״. ובזמן השיחה, חודש אייר וימי הספירה: ״מלכות שבתפארת״ הוא לימוד התורה בענייני מלך המשיח והגאולה, וזו ה״דרך ישרה״ לפעול את ביאת המשיח. ההוראה לכל אחד, ״וכן הנשים והטף״, להוסיף בלימוד הזה, ובמיוחד ״שהלימוד יהי׳ (ברבים) בעשרה״. והסיום: שבשבת זו ״תהי׳ לידת והתגלות משיח צדקנו״.",

  question:"מה ההבדל בין שופט, שוטר ויועץ, בגלות ובגאולה, ומה פירוש שיש נבואה גם לפני הגאולה?",
  summary:"השיחה פותחת בפרשה, ״שופטים ושוטרים תתן לך בכל שעריך״, וביעוד ״ואשיבה שופטיך כבראשונה ויועציך כבתחלה״, יחד עם הכרזת הריי״צ ״לאלתר לתשובה, לאלתר לגאולה״. ומיד באות השאלות: למה ביעוד לא נזכרו השוטרים, מה פירוש ״שופטיך״ ו״יועציך״, ולמה נאמר ״כבראשונה״ על השופטים ו״כבתחלה״ על היועצים. ומה ההבדל בין שופט לשוטר? השופט פוסק את הדין, ״והשוטרים ענינם לכפות ולהכריח״. לעתיד לבוא ״יצטרכו רק ״שופטים״, שיפסקו דינים וילמדו תורה״, כי ״ענין השוטרים הוא רק סיוע להשופטים״. והיועץ? השופט מצווה מלמעלה למטה, והיועץ נותן עצה ש״מתקבל יותר אצל שומע העצה, זה חודר בו בפנימיות מציאותו״. דווקא שני העניינים יחד, שופט ויועץ, מביאים את האדם עצמו להתמסר לתורה. עכשיו העבודה היא הכנה, ״צעד אחר צעד ודרגא אחר דרגא״. מכאן לנבואה: ״מיסודי הדת לידע שהא־ל מנבא את בני האדם״ (רמב״ם). אחרי שהריי״צ הכריז שכבר סיימו הכול, ״אוחזים כבר ברגעים האחרונים לפני הגאולה״. בסעיף יא: ההוראה לקבל את ההוראות של ״שופט דורנו ויועץ דורנו ונביא דורנו״, ש״הנבואה העיקרית״ שלו היא ״לאלתר לגאולה״, ו״לפרסם אצל עצמו ואצל כל אלו שאפשר להגיע אליהם״. בסעיף יב כל אחד הוא ״שופט״ ו״יועץ״ בתחומו, ומובא משל ״אבן השתי׳ – שנמצאת במקום מסויים בעולם הזה הגשמי״. והסיום בתפילה ״השיבה שופטינו כבראשונה ויועצינו כבתחלה״. במפה מובאים כאן דברי השיחה בלבד, בלי פרשנות.",

function cvChart(mode){
 const main=W.slice(0,-1);
 const keep=mode==="basic"?new Set(CHARTS.basic):new Set(main.flatMap(s=>s.nodes.map(n=>n.id)));
 const stages=main.map((s,i)=>({st:s.st,no:i,nodes:s.nodes.filter(n=>keep.has(n.id))})).filter(s=>s.nodes.length);
 const si={};stages.forEach((s,k)=>s.nodes.forEach((n,i)=>{si[n.id]={k,i}}));
 const hide=mode==="basic"?CHARTS.basicHide.map(x=>x.join(">")):[];
 const edges=MAINEDGES.filter(e=>si[e.from]&&si[e.to]&&!hide.includes(e.from+">"+e.to));
 /* מספר שלב בתוך השלב (גרסה 11): לפי סדר ההצגה. המושגים שמחוברים בקשר בתוך אותו שלב ממוספרים 1, 2, 3… לפי הסדר שבו הם מוצגים (מימין לשמאל) */
 const step={};
 stages.forEach((s,k)=>{
  const inS=edges.filter(e=>si[e.from].k===k&&si[e.to].k===k);
  if(!inS.length)return;

  let c=0;s.nodes.forEach(n=>{if(part.has(n.id))step[n.id]=++c});

}

const ART_TAGS={

/* ----- חיפוש חופשי ----- */
/* גרסה 16: תוצאות מקובצות ומסודרות:
   1. מושגים: שם המושג + השם המצורף. קודם התאמה בשם, אחר כך בשם נוסף (כינוי), ובסוף מושגים שהמילה מופיעה רק בהסבר שלהם.
   2. מאמרים שמסבירים את המושג: רק מאמר שהמושג מופיע בכותרת שלו, בנושאים המוצהרים שלו, או בכותרת של אחד מפרקי התרשים שלו.
      מאמר שרק מזכיר את המילה בתוך הטקסט אינו מופיע.
   3. סתירות: הנושא של הסתירה, או אחד משני הצדדים, מזכיר את המושג.
   4. מושג מול מושג: אחד משני המושגים בזוג הוא המושג.
   ולמטה, סגור: עוד מקומות שהמילה מופיעה בהם (הטבלה, שאלות גדולות). */
const q=$("q"),res=$("results");
const SHE=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
/* התאמה בתחילת מילה (מותרות אותיות שימוש לפני המילה, וסיומת אחריה): ״נפש״ מוצא ״שתי נפשות״ ו״בנפש״ */
const wordRe=t=>new RegExp("(^|[^א-ת])[ובכלמשהד]{0,3}"+SHE(NORMQ(t)));
const srShort=(s,n)=>{s=String(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n).replace(/\s+\S*$/,"")+"…":s};
const SR_STCAT={"מעל העולם":"a","איך נברא העולם":"a","העולם שאנחנו חיים בו":"a","האדם":"b","צדיק, בינוני ורשע":"b","מדרגות הנפש ותשובה":"b","העבודה":"c","העבודה בחיי היום-יום":"c","זמן, קהילה ושליחות":"c","התכלית":"c","להעמקה":"d"};
let srHits=[];
/* גרסה 17: כינוי נמצא בתוך חיפוש ארוך רק כמילה שלמה (״קו״ לא נמצא בתוך ״מקום״, ״חיה״ לא בתוך ״תחיית״) */
const aliasIn=(a,s)=>new RegExp("(^|[^א-ת])"+SHE(NORMQ(a))+"($|[^א-ת])").test(s);
function srRun(raw){
 const s=NORMQ(raw.trim());
 const has=x=>NORMQ(x).includes(s);
 const hits=[];const add=h=>{hits.push(h);return hits.length-1};
 /* 1. מושגים */
 const C1=[],C2=[],C3=[];
 W.forEach(st=>st.nodes.forEach(n=>{
  const cat=SR_STCAT[st.st.trim()]||"";
  const al=(typeof ALIAS!=="undefined"&&ALIAS[n.id]||[]).filter(a=>has(a)||aliasIn(a,s)).sort((a,b)=>(NORMQ(b)===s)-(NORMQ(a)===s)||(s.includes(NORMQ(b)))-(s.includes(NORMQ(a)))||a.length-b.length);
  const m=(MORE[n.id]||[]).filter(x=>x&&has(x[0]+" "+x[1]));
  const row={n,cat,go:"flow",nid:n.id};
  if(has(n.t)){row.rank=NORMQ(n.t)===s?0:(NORMQ(n.t).startsWith(s)?1:2);C1.push(row)}
  else if(has(n.sub)){row.rank=3;C1.push(row)}
  else if(al.length){row.al=al[0];C2.push(row)}
  else if(has(n.simple+" "+n.deep)||m.length){row.mh=(m.find(x=>has(x[0]))||[])[0]||"";C3.push(row)}
 }));
 C1.sort((a,b)=>a.rank-b.rank);
 const C=[...C1,...C2,...C3];C.forEach(r=>r.i=add(r));
 /* מונחים לחיפוש במאמרים ובסתירות: מה שהוקלד, ושם המושג כשנמצא דרך כינוי (״יצר הרע״ ← שתי נפשות) */
 const keys=[s,...C2.map(r=>r.n.t)];
 const kre=keys.map(wordRe);
 const hitK=x=>{const v=NORMQ(x||"");return kre.some(r=>r.test(v))};
 /* 2. מאמרים שמסבירים */
 const A=[];
 (typeof ARTICLES!=="undefined"?ARTICLES:[]).forEach((a,ai)=>{
  const why=[];
  if(hitK(a.title))why.push("t");
  const tags=artTags(a).filter(hitK);if(tags.length)why.push("g");
  const secs=(a.nodes||[]).filter(x=>hitK(x.t));
  if(!why.length&&!secs.length)return;

/* v14: ארבעת הסוגים (w90–w93) גרים בתוך התחנה של ״צדיק, בינוני, רשע״ ולא כתחנות נפרדות */
const NEST=typeof CV_NEST!=="undefined"?CV_NEST:{},NESTP=typeof CV_NESTP!=="undefined"?CV_NESTP:{};

/* v14: ״תרשים״ ראשון (התצוגה הרגילה שהקוראים מכירים), ״מסע״ לידו. הלשונית ״תרשים״ בסרגל העליון נשארת כמו ב-v13 */
SUBGROUPS.push([["flow","תרשים"],["journey","מסע"]]);
/* v14: מסך הפתיחה (home) הוסר לבקשת מנוחה; האתר נפתח בתרשים. כל קישור ל-home מוביל לתרשים */
{const hi=views.findIndex(x=>x[0]==="home");if(hi>=0)views.splice(hi,1);}

/* ---- סולם עומק: רק טקסט קיים ---- */
function sentences(t){
 const out=[];let d=0,b=0;t=String(t||"");
 for(let i=0;i<t.length;i++){const c=t[i];if(c==="(")d++;else if(c===")")d=Math.max(0,d-1);
  if(d===0&&(c==="."||c==="?"||c==="!")&&(i===t.length-1||t[i+1]===" ")){out.push(t.slice(b,i+1).trim());b=i+1}}
 if(t.slice(b).trim())out.push(t.slice(b).trim());
 return out;
}
const CITE=/\(([^()]*(תניא|פרק|אגרת|אגרות|סימן|שער|ליקוטי|לקוטי|ספר|קונטרס|מאמר|ד״ה|תורת מנחם|תו״מ|היום יום|באתי לגני|רמב״ם|הלכות|משנה|גמרא|ברכות|זוהר|זהר|עץ חיים|שיחת|שיחה|מכתב|אג״ק|חב״דפדיה|chabad|סעיף|דרך מצותיך|תהלים|משלי|ישעיה|ירמיה|יחזקאל|זכריה|בראשית|שמות|דברים|אבות|סנהדרין|יומא|פסחים|מגילה|שבת|חובות הלבבות|המשך|תש[א-ת״]|ספה״|רשימה|בלתי מוגה|שם)[^()]*)\)/;
function hasCite(x){return CITE.test(x)||/✓/.test(x)}
function hasQuote(x){return /״[^״]{12,}״/.test(x)}
function srcItems(n){
 const it=[];
 if(hasCite(n.deep)||hasQuote(n.deep))it.push({h:"בעומק",b:n.deep});

 return it;
}
function sfSrc(n){

/* v14 (בקשת מנוחה): שתי לשוניות בלבד. ״במשפט אחד״ = ההסבר המלא הקיים (בקצרה + בעומק), ״לשון המקור״ = המקומות שמביאים מקור */

  ${moHTML(n.id,mo)}

 }
 const it=srcItems(n),sf=sfSrc(n);
 return `<p class="jr-qnote">המקומות בהסבר שמביאים לשון מקור או מציינים מקור.</p>`+
  it.map(x=>`<div class="jr-q"><h5>${x.h}</h5><div>${x.b}</div></div>`).join("")+
  sf.map(x=>`<details${it.length?"":" open"}><summary>מקורות בתרשים המשנה: ${x.s.title} (${x.ns.length})</summary><div class="leaf">${x.ns.map(m=>`<p><b>${m.t}:</b> ${m.d||""}</p>${srcLine((m.conf==="ודאי"?"✓ ":"")+m.src)}`).join("")}</div></details>`).join("");
}

/* ---- עזר ---- */
const stageOf=id=>{const k=MAIN.findIndex(s=>s.nodes.some(n=>n.id===id));return k};
const isAsc=k=>k>=SPLIT;
function where(id){const k=stageOf(id);if(k<0){const p=cvParents(id);return "להעמקה"+(p.length?" · מעמיק את: "+p.map(x=>cvNode(x).t).join(", "):"")}

const cnt=n=>n===1?"מושג אחד":n+" מושגים";
const smooth=()=>RM()?"auto":"smooth";

/* ---- התצוגה ---- */
function card(n,i,deep){

function stageHTML(s,k){

function gaugeHTML(){
 const it=k=>`<li><button type="button" class="jr-g-i" data-k="${k}" data-cat="${catOf(k)}"><b>${CV_HEB[k]}</b>${MAIN[k].st}</button></li>`;

}
function vJourney(){
 const desc=MAIN.slice(0,SPLIT).map((s,k)=>stageHTML(s,k)).join(""),asc=MAIN.slice(SPLIT).map((s,i)=>stageHTML(s,i+SPLIT)).join("");
 view.innerHTML=`<div class="jr${J.far?" far":""}" id="jr">
  <section class="jr-hero" id="jrhero"><div class="jr-dotwrap" aria-hidden="true"><span class="jr-ring"></span><span class="jr-dot"></span></div>
   <div class="jr-hero-fade"><p class="jr-kick">בר השגה · מסע</p><h2>מסע במורד העולמות</h2>
   <p class="jr-lead">גוללים למטה ויורדים מאין סוף, שלב אחר שלב, עד האדם. אחר כך עולים, דרך העבודה, עד התכלית.</p>
   <p class="jr-how">לחצי על שלב כדי לפתוח אותו למושגים, ועל מושג כדי להתקרב אליו. בכל מושג יש סולם עומק: במשפט אחד, ולשון המקור.</p></div>
</section>
  <div class="jr-body">${gaugeHTML()}
   <div class="jr-track" id="jrtrack"><div class="jr-gbar" id="jrgbar" aria-live="off"><span class="dir"></span><b></b><span class="tk" aria-hidden="true">${MAIN.map((s,k)=>`<i class="${isAsc(k)?"a":"d"}" data-cat="${catOf(k)}" style="height:${isAsc(k)?(16-(k-SPLIT)*2.4):(4+k*3.6)}px"></i>`).join("")}</span><div class="jr-gz" role="group" aria-label="זום"><button type="button" data-z="out" aria-label="התרחקי"><span class="zi" aria-hidden="true"></span><span class="zl">התרחקי</span></button><button type="button" data-z="in" aria-label="התקרבי"><span class="zi p" aria-hidden="true"></span><span class="zl">התקרבי</span></button></div></div>
    ${LEG}<div class="jr-legend">״יסוד״ בפינת הכרטיס: מושג שמופיע גם בתרשים למתחילים. המספר בפינה השנייה הוא הסדר בתוך השלב, כמו בתרשים.</div>
    <div class="jr-sec desc first"><h3><span class="ar">↓</span> ירידה</h3><p>שלבים א׳–ד׳: מאין סוף אל האדם</p></div>${desc}
    <div class="jr-sec asc"><h3><span class="ar">↑</span> עלייה</h3><p>שלבים ה׳–${CV_HEB[NS-1]}: דרך העבודה, עד התכלית</p></div>${asc}
    ${stageHTML(DEEPV,NS)}
    <div class="jr-end"><button type="button" class="jr-btn" id="jrtop">חזרה לנקודה ↑</button><button type="button" class="jr-btn pri" id="jrchart">לתרשים הרגיל</button></div>
   </div></div>
  <div class="jr-pw" id="jrpw" hidden><div class="jr-scrim" id="jrscrim"></div><article class="jr-panel" id="jrpanel" role="dialog" aria-modal="true" aria-labelledby="jrpt" tabindex="-1"></article></div>
 </div>`;
 bind();
}
function bind(){
 const jr=$("jr");
 jr.querySelectorAll(".jr-st-h").forEach(b=>b.onclick=()=>{const k=+b.closest(".jr-st").dataset.k;if(J.far){setFar(false);setOpen(k,true);goStage(k);return}setOpen(k,!J.open.has(k))});

 $("jrtop").onclick=()=>window.scrollTo({top:0,behavior:smooth()});
 $("jrchart").onclick=()=>{setTab("flow");window.scrollTo({top:0})};
 jr.querySelectorAll('[data-z="in"]').forEach(b=>b.onclick=zoomIn);jr.querySelectorAll('[data-z="out"]').forEach(b=>b.onclick=()=>zoomOut());

function setOpen(k,on){

 const g=s.querySelector(".jr-grid-in");if(on)g.removeAttribute("inert");else g.setAttribute("inert","");
 zoomBtns();clearTimeout(J.t);J.t=setTimeout(()=>{if(cur==="journey"){J.now=-2;onScroll()}},450); /* v14: מד העומק מתעדכן גם אחרי פתיחה/סגירה */
}
function setFar(on){J.far=on;const jr=$("jr");if(jr)jr.classList.toggle("far",on);zoomBtns()}
function goStage(k){const s=$("jrs-"+k);if(!s)return;const off=document.body.classList.contains("phone")?52:14;window.scrollTo({top:s.getBoundingClientRect().top+scrollY-off,behavior:smooth()})}
function zoomBtns(){const jr=$("jr");if(!jr)return;const dis=!J.far&&J.open.size===NS+1;jr.querySelectorAll('[data-z="in"]').forEach(b=>b.disabled=dis)}
function zoomIn(){
 if(J.far){setFar(false);return}
 const k=J.now>=0?J.now:0;

}

 if(J.open.size){const k=J.now;for(const x of [...J.open])setOpen(x,false);if(k>=0)goStage(k);return}
 if(!J.far){setFar(true);const t=$("jrtrack");if(t)window.scrollTo({top:t.getBoundingClientRect().top+scrollY-8,behavior:smooth()});return}
 setFar(false);window.scrollTo({top:0,behavior:smooth()});

/* ---- גלילה: נקודה שמתפשטת, מד עומק ---- */
let raf=0;
function onScroll(){
 raf=0;const jr=$("jr");if(!jr||cur!=="journey")return;
 const hero=$("jrhero"),hh=hero.offsetHeight||1,p=Math.min(1,Math.max(0,(scrollY-hero.offsetTop+60)/hh));
 if(!RM()){hero.style.setProperty("--jp-s",(1+p*2.2).toFixed(3));hero.querySelector(".jr-ring").style.cssText=`opacity:${(p*.9).toFixed(3)};transform:scale(${(1+p*5).toFixed(3)})`;}
 hero.style.setProperty("--jp-o",(1-p*1.1).toFixed(3));jr.classList.toggle("inhero",hero.getBoundingClientRect().bottom>innerHeight*.55);
 const line=innerHeight*.38;let now=-1;

  jr.querySelectorAll(".jr-g-i").forEach(b=>{const k=+b.dataset.k;b.classList.toggle("now",k===now);b.classList.toggle("past",now>=0&&k<now&&now<NS||now===NS)});

   g.querySelectorAll(".tk i").forEach((t,j)=>{t.classList.toggle("now",j===k&&!deep);t.classList.toggle("past",j<k||deep)})}
 }
}

/* ---- זום פנימה: מושג ---- */
