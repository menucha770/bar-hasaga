  </div></div>
  <div class="jr-sfv" id="jrsfv"${J.sf===null?" hidden":""}></div>`;
}
function fillPanel(id){
 const p=$("jrpanel");p.innerHTML=panelHTML(id);{const sk=stageOf(id);p.dataset.cat=catOf(sk<0?NS:sk)}
 $("jrclose").onclick=()=>zoomOut();
 p.querySelectorAll("[data-go]").forEach(b=>{if(b.dataset.go)b.onclick=()=>moveTo(b.dataset.go)});
 p.querySelectorAll("[data-sf]").forEach(b=>b.onclick=()=>openSf(+b.dataset.sf));
 const steps=[...p.querySelectorAll(".jr-step")];
 steps.forEach((b,ix)=>{b.onclick=()=>setLvl(+b.dataset.l);b.onkeydown=e=>{let j=-1;if(e.key==="ArrowLeft")j=Math.min(steps.length-1,ix+1);if(e.key==="ArrowRight")j=Math.max(0,ix-1);if(j>=0){e.preventDefault();setLvl(+steps[j].dataset.l);p.querySelector('.jr-step[data-l="'+steps[j].dataset.l+'"]').focus()}}});
 if(J.sf!==null)drawSf(J.sf);
}
function setLvl(l){
 J.lvl=l;const p=$("jrpanel"),n=cvNode(J.id);
 p.querySelectorAll(".jr-step").forEach(b=>{const x=+b.dataset.l;b.classList.toggle("on",x===l);b.classList.toggle("below",x<l);b.setAttribute("aria-selected",x===l);b.tabIndex=x===l?0:-1});
 const lvEl=$("jrlv");lvEl.innerHTML=lvHTML(n,l);lvEl.classList.remove("swap");void lvEl.offsetWidth;lvEl.classList.add("swap");
}
function flip(el,r0,dir){
 if(RM()||!r0||!el.animate)return;
 const r1=el.getBoundingClientRect();if(!r1.width)return;
 const sx=r0.width/r1.width,sy=r0.height/r1.height,dx=r0.left-r1.left,dy=r0.top-r1.top;
 const a=[{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.25},{transform:"none",opacity:1}];
 return el.animate(dir>0?a:a.reverse(),{duration:dir>0?300:220,easing:"cubic-bezier(.2,.7,.2,1)",fill:"both"});
}
function openC(id,fromEl){
 const pw=$("jrpw"),p=$("jrpanel");if(!pw)return;
 const wasOpen=!!J.id;J.id=id;J.sf=null;
 if(!wasOpen){J.from=fromEl||null;J.lvl=levels(cvNode(id))[0];}
 fillPanel(id);
 if(!wasOpen){
  pw.hidden=false;document.documentElement.style.overflow="hidden";
  requestAnimationFrame(()=>pw.classList.add("in"));
  const a=flip(p,fromEl&&fromEl.getBoundingClientRect(),1);if(a)a.onfinish=()=>a.cancel();
  try{if(!(history.state&&history.state.jc))history.pushState({v:"journey",jc:id},"","#journey");else history.replaceState({v:"journey",jc:id},"","#journey")}catch(e){}
 }else{try{history.replaceState({v:"journey",jc:id},"","#journey")}catch(e){}}
 p.scrollTop=0;p.focus({preventScroll:true});
}
function moveTo(id){
 const host=NESTP[id]||id,k=stageOf(host),kk=k<0?NS:k;if(!J.open.has(kk))setOpen(kk,true);
 J.from=document.querySelector('.jr-c[data-id="'+host+'"]');
 J.sf=null;J.id=id;fillPanel(id);const p=$("jrpanel");p.scrollTop=0;
 const lvEl=$("jrmain");if(lvEl&&!RM()){lvEl.classList.remove("swap");void lvEl.offsetWidth;lvEl.classList.add("jr-lv","swap")}
 try{history.replaceState({v:"journey",jc:id},"","#journey")}catch(e){}
 const c=J.from;if(c){const r=c.getBoundingClientRect();if(r.top<60||r.bottom>innerHeight-60)window.scrollTo({top:r.top+scrollY-innerHeight/3})}
}
function closeC(fromPop){
 const pw=$("jrpw"),p=$("jrpanel");if(!pw||!J.id)return;
 const id=J.id;J.id=null;J.sf=null;
 const c=document.querySelector('.jr-c[data-id="'+(NESTP[id]||id)+'"]');
 const done=()=>{pw.hidden=true;pw.classList.remove("in");p.innerHTML="";document.documentElement.style.overflow="";if(c)c.focus({preventScroll:true})};
 pw.classList.remove("in");
 const r=c&&c.getBoundingClientRect();const vis=r&&r.width&&r.bottom>0&&r.top<innerHeight;
 const a=vis?flip(p,r,-1):null;if(a)a.onfinish=done;else done();
 if(!fromPop){try{if(history.state&&history.state.jc)history.back()}catch(e){}}
}
function openSf(i){J.sf=i;$("jrmain").hidden=true;const v=$("jrsfv");v.hidden=false;drawSf(i);$("jrpanel").scrollTop=0;if(!RM()){v.classList.remove("swap");void v.offsetWidth;v.classList.add("jr-lv","swap")}}
function drawSf(i){
 const s=SUBFLOWS[i],v=$("jrsfv"),n=cvNode(J.id);
 v.innerHTML=`<div class="cv-where" style="font-size:13px;color:var(--muted)">תרשים משנה של: ${n.t}</div><h3>${s.title}</h3><p class="hint">${s.intro||""}</p><div id="jrsfbox"></div>`;
 drawFlow($("jrsfbox"),autoRows(s.nodes,s.edges||[]),s.edges||[],null,id=>{const m=s.nodes.find(x=>x.id===id);return `<p>${m.d||""}</p>${m.src?srcLine((m.conf==="ודאי"?"✓ ":"")+m.src):""}`});
}
/* התרחקי מתוך תרשים משנה חוזר למושג */
const _zo=zoomOut;
zoomOut=function(){if(J.id&&J.sf!==null){J.sf=null;$("jrsfv").hidden=true;$("jrmain").hidden=false;$("jrpanel").scrollTop=0;return}_zo()};
document.addEventListener("keydown",e=>{if(cur!=="journey")return;if(e.key==="Escape"&&J.id){e.preventDefault();zoomOut()}
 if(J.id&&e.key==="Tab"){const p=$("jrpanel");const f=[...p.querySelectorAll("button:not([disabled]),summary,a[href],[tabindex='0']")].filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});

/* ---- חיבור לניתוב הקיים ---- */
const _st=setTab;
function tabsBar(v){
 const act=(subGroupOf(v)||[[v]])[0][0];
 tabsEl.innerHTML=TABSHOW.map(([k,n])=>`<button class="tab ${k===act?"on":""}" data-k="${k}">${n}</button>`).join("");
 tabsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{setTab(b.dataset.k);window.scrollTo({top:0})});
}
function subBar(v){
 const g=subGroupOf(v);if(!g||!g.some(x=>x[0]==="journey"))return;
 view.querySelectorAll(".subtabs button").forEach(b=>b.onclick=()=>{setTab(b.dataset.k);window.scrollTo({top:0})});
}
setTab=function(v,push){
 if(v==="home"||!v)v="flow";
 if(v==="journey"&&push===false&&cur==="journey"&&$("jr")){ /* חזרה בדפדפן בתוך המסע */
  const st=history.state||{};if(J.id&&!st.jc)closeC(true);else if(st.jc&&!J.id)openC(st.jc,document.querySelector('.jr-c[data-id="'+st.jc+'"]'));
  return;
 }
 if(J.id){J.id=null;J.sf=null;document.documentElement.style.overflow=""}
 if(v!=="journey"){inST=true;try{_st(v,push)}finally{inST=false}subBar(v);return}
 cur="journey";
 if(push!==false){try{if(!(history.state&&history.state.v==="journey"))history.pushState({v:"journey"},"","#journey")}catch(e){}}
 document.body.classList.remove("is-home");
 tabsBar("journey");
 vJourney();
 const g=subGroupOf("journey");
 view.insertAdjacentHTML("afterbegin",`<div class="subtabs" aria-label="מסע או תרשים">${g.map(([k,n])=>`<button type="button" data-k="${k}" class="${k==="journey"?"on":""}">${n}</button>`).join("")}</div>`);
 subBar("journey");
};
/* v14 תיקון: מעבר בין ״למתחילים / למתקדמים״ (או כל ציור מחדש של התרשים) מחק את המעבר ״תרשים | מסע״ — מחזירים אותו אחרי כל ציור */
let inST=false;
function ensureFlowSub(){
 if(inST||cur!=="flow")return;
 const f=view.firstElementChild;if(f&&f.classList.contains("subtabs")&&f.querySelector('[data-k="journey"]'))return;
 const g=subGroupOf("flow");if(!g)return;
 view.insertAdjacentHTML("afterbegin",`<div class="subtabs">${g.map(([k,n])=>`<button type="button" data-k="${k}" class="${k==="flow"?"on":""}">${n}</button>`).join("")}</div>`);
 subBar("flow");
}
if(typeof vFlow==="function"){const oV=vFlow;vFlow=function(){const r=oV.apply(this,arguments);ensureFlowSub();return r}}
if(typeof vFlowPhone==="function"){const oP=vFlowPhone;vFlowPhone=function(){const r=oP.apply(this,arguments);ensureFlowSub();return r}}
/* כניסה (v14): הדף נפתח כמו האתר החי (התצוגה הרגילה). המסע נפתח מהכפתור ״מסע״ שליד ״תרשים״, מכרטיס בעמוד הראשי, או מכתובת עם ‎#journey */
const h0=(window.__JH0||"").replace("#","");
if(h0==="journey"){try{history.replaceState({v:"journey"},"","#journey")}catch(e){}J.sub=1;setTab("journey",false);J.sub=0}
else{const v=cur==="home"?"flow":cur;try{if(cur==="home")history.replaceState({v:"flow"},"","#flow")}catch(e){}setTab(v,false)}
})();
